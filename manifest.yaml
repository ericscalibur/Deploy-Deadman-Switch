id: deadman-switch
title: "Deploy: Deadman Switch"
version: 2.1.2
release-notes: |
  - The recipient table no longer flickers. A background sync rebuilt the
    table every 5 seconds even when nothing had changed, blanking each
    recipient's status line and shifting everything below it. It now
    redraws only on an actual change, and the status line holds its height.
  - Deploying or aborting no longer flickers between states. The 5-second
    sync could not see a switch the server had not finished creating, so it
    reported "not armed" mid-request and flipped the button back. The
    button now shows "Deploying..." while the request is in flight and is
    disabled, so the one action that should never be issued twice cannot be.
  - Fix: the background sync timer was never cleared, so a new one started
    on every login and again after deployment. They accumulated, multiplying
    requests over Tor and leaving several writers fighting over the
    dashboard's state.
  - The trigger email now leads with the decryption tool rather than the
    instructions, and offers two routes: a SeedSigner running Legacy
    Encryption, where the seed phrase is recovered on the device and never
    touches a computer, or the Legacy Decryption tool in a browser. The
    cold route is stated as needing that hardware, so nobody starts down it
    expecting a quick step.
  - The per-recipient address-confirmation control now sits in the corner of
    the message editor instead of spanning the full width above the fields
    it qualifies.
  - Address confirmation can now be turned off for an individual
    recipient, in that recipient's message editor. Some beneficiaries can
    be told they have been listed; some must learn nothing until the
    message arrives. It stays ON by default and should usually stay on —
    the recipient's click is the only real proof their address still
    reaches them. Turning it off does not affect delivery: that recipient
    still receives your message when the switch fires. The recipient table
    shows which addresses have been confirmed and which are deliberately
    unverified.
  - The ACTIVATION notice now stays on screen until you dismiss it. It
    previously appeared for about two seconds before the display reset to
    00:00:00, so the one event the whole system exists to announce could
    vanish before it was read. The countdowns now read ACTIVATED and
    CLOSED after a switch fires instead of resetting to zero.
  - Fix: a recipient could receive the "you have been listed as a trusted
    contact" email two or three times from a single edit. Each recipient
    edit starts a contact pass, and passes that overlapped all read
    "never contacted" before any of them recorded the send. Contact passes
    are now serialized per operator. Duplicate unexplained mail is exactly
    what makes a beneficiary dismiss this as spam, and their click is the
    only real confirmation an address works.
  - A restart no longer sends the arming reminder with the URGENT subject.
    URGENT means "you have been ignoring this", not "the server rebooted".
  - While a switch is PENDING, the check-in caption now says what to do
    ("Click the link in the email you just received") instead of labelling
    a countdown that is not running.
  - Documented what happens while the host computer is off: check-in
    emails are not stockpiled, but a deadline that passes while the
    machine is off is still honoured and fires on restart.
  - (2.1.0) Arming now requires completing the first check-in. Deploying a switch
    holds it in PENDING: the first check-in email is sent immediately, and
    only clicking its link arms the switch and starts the countdown —
    proving the whole loop (email delivery, link reachability over Tor,
    check-in handling) before anything can fire. A pending switch cannot
    fire or escalate, re-sends its arming email every check-in interval,
    and survives restarts.
  - Out-of-band alerts via ntfy push notifications (new config fields
    "ntfy Alert Topic" / "ntfy Server"). Deploy can now tell you it is sick
    over a channel independent of email and Tor: broken SMTP (and
    recovery), check-in emails that could not be sent, missed check-ins,
    the pre-fire warning, the switch firing, delivery failures, and
    unresponsive recipient addresses. Leave the topic empty to disable.
  - Fix: outbound SMTP no longer breaks silently on networks that hand out
    IPv6 addresses with no working IPv6 route (DNS resolution now prefers
    IPv4). Previously email could fail at startup with EAI_AGAIN while DNS
    looked healthy.
  - (2.0.13) Fix: QR photos of SeedSigner (and other LCD) screens now decode. The
    decoder gains an adaptive-threshold pass — a screen's uneven backlight
    defeats global contrast stretching, so modules are now binarized
    against their local neighbourhood instead. Verified against a real
    SeedSigner photo that previously failed every decode attempt.
  - Beneficiary contact is now established the moment a switch is armed:
    every never-verified recipient immediately gets a first-contact email
    introducing the system, with a one-click confirmation link. Previously
    the first contact waited for the daily sweep — up to 24h later, and
    never on a short-lived test switch. Recipients added to an armed switch
    are contacted immediately too.
  - When a recipient clicks the confirmation link, the operator now gets a
    notice that the line of communication is open (and on later annual
    checks, that the address is still live). The notice does not name the
    address; the dashboard's "Last contact" line shows which.
  - The annual cycle is testable at short intervals via env overrides:
    PING_INTERVAL_MS, PING_ACK_GRACE_MS, BENEFICIARY_SWEEP_INTERVAL_MS.
  - Fix: beneficiary changes made while a switch is armed now take effect
    immediately. Previously edits only changed the stored data — the armed
    switch kept firing at its activation-time snapshot, so beneficiaries
    added after deployment were silently excluded and removed ones still
    received the trigger email. Adds, edits and deletes now propagate to
    the live switch (including the encrypted envelope used for delivery
    after a restart), and the UI says so explicitly when it happens.
  - Guard: the last remaining recipient cannot be deleted while the switch
    is armed — deactivate first. A switch that fires to nobody is worse
    than one that refuses the edit.
  - The trigger email no longer embeds the full Legacy decryption
    specification. It now carries the user's message, the encrypted payload
    and QR, and short instructions linking to the Legacy decrypt page, the
    downloadable offline copy, and the FAQ — where the full reimplementation
    spec now lives (Legacy_Encryption FAQ item 10). The payload itself still
    rides in the email; only the how-to-decrypt moved behind links.
  - The dashboard now shows each recipient's contact status under their
    address: "Last contact" with the date they last confirmed via the
    annual address check, "awaiting reply" while a check is outstanding,
    or "first annual check pending". Ping records are stored keyed by
    address hash only, so the mapping to readable addresses happens after
    decrypting the recipient list with the operator's password (new
    POST /deadman/beneficiary-status endpoint).
  - Fix: Backup actually backs up data now. The backup procedures declared
    no volume mounts, so backup.sh copied empty directories to an unmounted
    target and reported success while saving nothing — and Restore
    "succeeded" the same way. Both now mount the data volume and the backup
    target, and back up /app/data (database, .env including SECRET_KEY,
    config). SECRET_KEY is included deliberately: StartOS encrypts backups,
    and a restore without it could not decrypt the server-side delivery
    envelope, leaving a restored switch unable to fire.
  - Fix: Properties failed StartOS 0.4's schema validation (and returned
    stale placeholder data on 0.3.x). Now reports Version, Status, Email
    Provider and Service URL in the required typed format.
  - Fix: a check-in email could be sent milliseconds after the deadman
    deadline had already fired (visible at short test intervals as a
    "check in now" email for a switch that was already closed). Check-in
    timers now stand down once the deadline has passed.
  - Fix: saving a recipient email without a valid address is now rejected,
    and activation refuses to arm a switch with no deliverable recipient.
    Previously a malformed save request could arm a switch that would
    "fire" to nobody, with the failure surfacing only at trigger time.
  - Fix: uploading a QR photo only ever attempted one decode. The decoder is
    written to try two resolutions, but the pure-JS image path handed it the
    same pixel buffer twice, so every attempt ran at native resolution. It
    now builds seven variants — 0.35x/0.5x/0.75x/native/2x plus a centre crop
    — and runs both ZXing and jsQR over each. Downscaling is box-averaged,
    which suppresses the moiré from photographing a screen and is usually
    what rescues a photo that fails at full resolution.
  - Fix: removed the unused `certificate` volume. The container has always
    served plain HTTP behind StartOS's TLS termination and never read
    /mnt/cert, but declaring the volume made StartOS 0.4 request a
    certificate covering every address bound to the interface — including
    the public IPv4, which it rejects as an unknown hostname. The failed
    request left the interface with no certificate, so HTTPS connections
    were closed during the TLS handshake.
  - Fix: saving config failed validation on StartOS 0.4 because its result
    schema requires a `signal` field (the dependency fields are optional,
    signal is not). The configurator now returns SIGTERM.
  - Fix: saving config hung forever on StartOS 0.4. Its compat layer passes
    the new config as a command-line argument, while 0.3.x piped it on
    stdin — so the configurator blocked on a stdin that never received data
    and was never closed. It now reads the argument and falls back to stdin.
  - Beneficiary emails containing an ack link now say explicitly that a
    .onion link opens only in Tor Browser, and where to get it. Without this
    a beneficiary sees Chrome report the page as unavailable and reasonably
    concludes the link is dead — so the warning is never acknowledged. The
    notice appears only when the link really is an onion address.
  - Packaging: shipped as a V2 s9pk. StartOS 0.4.x refuses to sideload the
    V1 package format, so the package is now converted with
    `start-cli s9pk convert` before release.
  - Fix: the config spec omitted two keys that StartOS 0.3.x treated as
    optional but 0.4 requires — `value-names` on enum fields and `integral`
    on number fields — which made the Config dialog fail validation.
  - Fix: the Config and Backup actions failed under StartOS 0.4 with
    "SyntaxError: ... is not valid JSON". The 0.4 legacy compatibility layer
    parses action output as JSON even when the manifest declares
    `io-format: yaml`, so these actions now emit JSON (a valid YAML subset,
    so older StartOS releases are unaffected).
  - Fix: backup.sh wrote human-readable progress messages to stdout,
    corrupting the structured result StartOS parses. They now go to stderr.
  - Fix: the switch's database session is now closed ONLY after deadman
    emails are confirmed delivered. Previously delivery was fire-and-forget
    and the switch was torn down regardless, so one SMTP failure at trigger
    time (e.g. network not yet up right after a reboot) silently lost the
    delivery forever. On failure the switch now stays active, the owner is
    alerted, delivery retries every 10 minutes, and any restart retries too.
  - Fix: a switch that fired while the server was running never closed its
    database session, so every later restart re-fired it and re-sent the
    deadman emails to all recipients.
  - Security: the activation endpoints no longer log the raw request body,
    which contained the user's plaintext password.
  - Fix: when the login session (24h) expires, the dashboard now returns to
    the login page with an explanation instead of silently freezing the
    countdown display while the switch keeps running server-side.
license: GPL-3.0
min-os-version: 0.3.5
wrapper-repo: https://github.com/ericscalibur/Deploy-Deadman-Switch
upstream-repo: https://github.com/ericscalibur/Deploy-Deadman-Switch
support-site: https://github.com/ericscalibur/Deploy-Deadman-Switch/issues
marketing-site: https://github.com/ericscalibur/Deploy-Deadman-Switch
donation-url: ~
build: ["make"]
description:
  short: Automated email deadman switch service
  long: |
    A secure, web-based deadman switch service that automatically sends pre-configured emails
    to designated recipients if you fail to check in within a specified time period. Features
    include JWT authentication, encrypted data storage, configurable timers, and one-click
    email check-ins.

assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md

main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /app/data
  sigterm-timeout: 30s

health-checks:
  web-ui:
    name: Web Interface
    success-message: Deadman Switch is ready for configuration
    type: docker
    image: main
    entrypoint: check-web.sh
    args: []
    io-format: json
    inject: true

config:
  get:
    type: docker
    image: main
    entrypoint: configurator.sh
    args: ["get"]
    io-format: yaml
    mounts:
      main: /app/data
  set:
    type: docker
    image: main
    entrypoint: configurator.sh
    args: ["set"]
    io-format: yaml
    mounts:
      main: /app/data

properties:
  type: docker
  image: main
  entrypoint: properties.sh
  args: []
  io-format: json
  mounts:
    main: /app/data

volumes:
  main:
    type: data
# No `certificate` volume: StartOS terminates TLS for this interface and the
# container serves plain HTTP on 3000 (docker_entrypoint.sh unsets
# SSL_KEY_PATH/SSL_CERT_PATH, and nothing ever reads /mnt/cert). Declaring one
# made the 0.4 compat layer request a cert covering every address on the
# interface, including the public IPv4 — which StartOS rejects with
# "unknown hostname", failing the whole request.

interfaces:
  main:
    name: Web Interface
    description: Main web interface for configuring and monitoring the deadman switch
    tor-config:
      port-mapping:
        80: "3000"
    lan-config:
      443:
        ssl: true
        internal: 3000
    ui: true
    protocols:
      - tcp
      - http

dependencies: {}

# BACKUP is the magic backup-target volume; StartOS supplies it to backup
# procedures. Without these mounts backup.sh runs against empty directories
# and reports success while saving nothing.
backup:
  create:
    type: docker
    image: main
    entrypoint: backup.sh
    args: ["create"]
    io-format: json
    mounts:
      BACKUP: /mnt/backup
      main: /app/data
  restore:
    type: docker
    image: main
    entrypoint: backup.sh
    args: ["restore"]
    io-format: json
    mounts:
      BACKUP: /mnt/backup
      main: /app/data

migrations:
  from: {}
  to: {}
