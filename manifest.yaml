id: deadman-switch
title: "Deploy: Deadman Switch"
version: 1.0.39
release-notes: |
  - Fix: timer state is now saved to the database immediately after a
    check-in. A variable-scope bug made that save fail on every check-in
    (ReferenceError), leaving the previous deadman deadline in the database
    until the next periodic save — or indefinitely for switches restored
    after a restart. A crash in that window could recover a stale deadline
    and trigger the switch prematurely.
  - Fix: switches restored after a restart rejoin the periodic state-save
    loop after a successful check-in.
  - Fix: database timestamps without a timezone marker are now parsed as UTC
    during recovery. They were parsed as local time, so after a restart the
    next check-in email was scheduled hours late (by the machine's UTC
    offset) for users west of UTC, or too early for users east of it.
license: GPL-3.0
min-os-version: 0.3.5
wrapper-repo: https://github.com/ericscalibur/Deploy-Deadman-Switch
upstream-repo: https://github.com/ericscalibur/Deploy-Deadman-Switch
support-site: https://github.com/ericscalibur/Deploy-Deadman-Switch/issues
marketing-site: https://github.com/ericscalibur/Deploy-Deadman-Switch
donation-url: ~
build: ["make"]
description:
  short: Automated email deadman switch service
  long: |
    A secure, web-based deadman switch service that automatically sends pre-configured emails
    to designated recipients if you fail to check in within a specified time period. Features
    include JWT authentication, encrypted data storage, configurable timers, and one-click
    email check-ins.

assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md

main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /app/data
    cert: /mnt/cert
  sigterm-timeout: 30s

health-checks:
  web-ui:
    name: Web Interface
    success-message: Deadman Switch is ready for configuration
    type: docker
    image: main
    entrypoint: check-web.sh
    args: []
    io-format: json
    inject: true

config:
  get:
    type: docker
    image: main
    entrypoint: configurator.sh
    args: ["get"]
    io-format: yaml
    mounts:
      main: /app/data
  set:
    type: docker
    image: main
    entrypoint: configurator.sh
    args: ["set"]
    io-format: yaml
    mounts:
      main: /app/data

properties:
  type: docker
  image: main
  entrypoint: properties.sh
  args: []
  io-format: json

volumes:
  main:
    type: data
  cert:
    type: certificate
    interface-id: main

interfaces:
  main:
    name: Web Interface
    description: Main web interface for configuring and monitoring the deadman switch
    tor-config:
      port-mapping:
        80: "3000"
    lan-config:
      443:
        ssl: true
        internal: 3000
    ui: true
    protocols:
      - tcp
      - http

dependencies: {}

backup:
  create:
    type: docker
    image: main
    entrypoint: backup.sh
    args: ["create"]
    io-format: yaml
  restore:
    type: docker
    image: main
    entrypoint: backup.sh
    args: ["restore"]
    io-format: yaml

migrations:
  from: {}
  to: {}
