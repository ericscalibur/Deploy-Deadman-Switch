id: deadman-switch
title: "Deploy: Deadman Switch"
version: 1.0.37
release-notes: |
  - Fix: schema migrations now run at server startup, not just in the Start9
    entrypoint — local/self-hosted installs were missing the
    server_encrypted_emails column, so the restart-recovery envelope was never
    saved (SQLITE_ERROR) and expired switches could not deliver after a reboot.
  - The pre-built database is no longer shipped in the repo; tables are
    created automatically on first run.
license: GPL-3.0
min-os-version: 0.3.5
wrapper-repo: https://github.com/ericscalibur/Deploy-Deadman-Switch
upstream-repo: https://github.com/ericscalibur/Deploy-Deadman-Switch
support-site: https://github.com/ericscalibur/Deploy-Deadman-Switch/issues
marketing-site: https://github.com/ericscalibur/Deploy-Deadman-Switch
donation-url: ~
build: ["make"]
description:
  short: Automated email deadman switch service
  long: |
    A secure, web-based deadman switch service that automatically sends pre-configured emails
    to designated recipients if you fail to check in within a specified time period. Features
    include JWT authentication, encrypted data storage, configurable timers, and one-click
    email check-ins.

assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md

main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /app/data
    cert: /mnt/cert
  sigterm-timeout: 30s

health-checks:
  web-ui:
    name: Web Interface
    success-message: Deadman Switch is ready for configuration
    type: docker
    image: main
    entrypoint: check-web.sh
    args: []
    io-format: json
    inject: true

config:
  get:
    type: docker
    image: main
    entrypoint: configurator.sh
    args: ["get"]
    io-format: yaml
    mounts:
      main: /app/data
  set:
    type: docker
    image: main
    entrypoint: configurator.sh
    args: ["set"]
    io-format: yaml
    mounts:
      main: /app/data

properties:
  type: docker
  image: main
  entrypoint: properties.sh
  args: []
  io-format: json

volumes:
  main:
    type: data
  cert:
    type: certificate
    interface-id: main

interfaces:
  main:
    name: Web Interface
    description: Main web interface for configuring and monitoring the deadman switch
    tor-config:
      port-mapping:
        80: "3000"
    lan-config:
      443:
        ssl: true
        internal: 3000
    ui: true
    protocols:
      - tcp
      - http

dependencies: {}

backup:
  create:
    type: docker
    image: main
    entrypoint: backup.sh
    args: ["create"]
    io-format: yaml
  restore:
    type: docker
    image: main
    entrypoint: backup.sh
    args: ["restore"]
    io-format: yaml

migrations:
  from: {}
  to: {}
