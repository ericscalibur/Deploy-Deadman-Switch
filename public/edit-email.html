<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Edit Email</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <style>
            .qr-divider {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 12px 0 10px;
                color: ghostwhite;
                font-size: 13px;
                opacity: 0.8;
            }
            .qr-divider::before,
            .qr-divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: rgba(255,255,255,0.3);
            }
            .qr-buttons {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .qr-btn {
                background: rgba(255,255,255,0.15);
                color: ghostwhite;
                border: 1px solid rgba(255,255,255,0.4);
                border-radius: 6px;
                padding: 8px 14px;
                cursor: pointer;
                font-size: 14px;
                transition: background 0.2s;
            }
            .qr-btn:hover {
                background: rgba(255,255,255,0.25);
            }
            .qr-scan-panel {
                margin-top: 12px;
                display: none;
            }
            .qr-scan-panel video {
                width: 100%;
                max-width: 320px;
                border-radius: 6px;
                border: 2px solid rgba(255,255,255,0.3);
                display: block;
            }
            .qr-status {
                margin-top: 8px;
                font-size: 13px;
                min-height: 18px;
                border-radius: 5px;
                padding: 0;
                transition: padding 0.15s;
            }
            .qr-status:not(:empty) { padding: 7px 10px; }
            .qr-status.success { color: #5de88a; background: rgba(93,232,138,0.1); }
            .qr-status.error   { color: #ff7b7b; background: rgba(255,123,123,0.12); }
            .qr-status.info    { color: ghostwhite; opacity: 0.85; background: rgba(255,255,255,0.07); }
            .photo-preview {
                display: none;
                align-items: center;
                gap: 10px;
                margin-top: 10px;
            }
            .photo-preview img {
                width: 64px;
                height: 64px;
                object-fit: cover;
                border-radius: 6px;
                border: 2px solid rgba(255,255,255,0.3);
                display: block;
            }
            .photo-badge {
                position: absolute;
                bottom: -8px;
                right: -8px;
                font-size: 17px;
                line-height: 1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Edit Email</h1>
            <form id="edit-email-form">
                <label for="email-address">Email Address:</label>
                <input
                    type="email"
                    id="email-address"
                    name="email-address"
                    required
                /><br /><br />

                <label for="email-content">Email Content:</label>
                <br />
                <textarea
                    id="email-content"
                    name="email-content"
                    rows="10"
                    cols="50"
                    maxlength="2000"
                    required
                ></textarea
                ><br /><br />

                <label for="email-payload">Encrypted Payload (optional):</label>
                <br />
                <small>Paste the Legacy encrypted ciphertext here. A QR code will be generated and embedded in the email automatically — the recipient just scans it to decrypt.</small>
                <br /><br />
                <textarea
                    id="email-payload"
                    name="email-payload"
                    rows="4"
                    cols="50"
                    placeholder="Paste encrypted Legacy ciphertext here..."
                ></textarea>

                <!-- QR input alternatives -->
                <div class="qr-divider">or fill from SeedSigner</div>
                <div class="qr-buttons">
                    <button type="button" class="qr-btn" id="scan-live-btn" title="Requires HTTPS — not available on the .onion address">📷 Scan live</button>
                    <button type="button" class="qr-btn" id="upload-photo-btn">🖼 Upload photo</button>
                </div>

                <!-- Status sits right under buttons so it's always visible -->
                <div class="qr-status" id="qr-status"></div>

                <input type="file" id="qr-photo-input" accept="image/*" style="display:none" />
                <div class="photo-preview" id="photo-preview">
                    <div style="position:relative; display:inline-block;">
                        <img id="photo-thumb" alt="uploaded photo" />
                        <span class="photo-badge" id="photo-badge"></span>
                    </div>
                </div>

                <!-- Live scanner -->
                <div class="qr-scan-panel" id="qr-scan-panel">
                    <video id="qr-video" autoplay playsinline muted></video>
                    <canvas id="qr-canvas" style="display:none"></canvas>
                    <button type="button" class="qr-btn" id="stop-scan-btn" style="margin-top:8px">Stop</button>
                </div>

                <br /><br />
                <button type="submit" id="save-email-button">Save</button>
            </form>
        </div>

        <script src="/jsqr.min.js"></script>
        <script src="/zxing.min.js"></script>
        <script src="/pako_inflate.min.js"></script>
        <script src="/upng.js"></script>
        <script src="/jpegdecoder.js"></script>
        <script>
            // ── QR scanning ──────────────────────────────────────────────

            const payloadTextarea = document.getElementById("email-payload");
            const scanLiveBtn     = document.getElementById("scan-live-btn");
            const uploadPhotoBtn  = document.getElementById("upload-photo-btn");
            const photoInput      = document.getElementById("qr-photo-input");
            const scanPanel       = document.getElementById("qr-scan-panel");
            const video           = document.getElementById("qr-video");
            const canvas          = document.getElementById("qr-canvas");
            const statusEl        = document.getElementById("qr-status");
            const stopScanBtn     = document.getElementById("stop-scan-btn");
            const photoPreview    = document.getElementById("photo-preview");
            const photoThumb      = document.getElementById("photo-thumb");
            const photoBadge      = document.getElementById("photo-badge");

            let scanTimer = null;
            let stream    = null;

            // Disable Scan live upfront if camera API is unavailable (http:// .onion, etc.)
            if (!navigator.mediaDevices?.getUserMedia) {
                scanLiveBtn.disabled = true;
                scanLiveBtn.title = "Camera requires HTTPS — not available on the .onion address. Use Upload photo instead.";
                scanLiveBtn.style.opacity = "0.45";
                scanLiveBtn.style.cursor = "not-allowed";
            }

            function contrastStretch(ctx, w, h) {
                const img = ctx.getImageData(0, 0, w, h);
                const d = img.data;
                let lo = 255, hi = 0;
                for (let i = 0; i < d.length; i += 4) {
                    const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                    if (v < lo) lo = v;
                    if (v > hi) hi = v;
                }
                const range = hi - lo || 1;
                for (let i = 0; i < d.length; i += 4) {
                    const v = Math.round(((0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) - lo) / range * 255);
                    d[i] = d[i + 1] = d[i + 2] = v;
                }
                ctx.putImageData(img, 0, 0);
                return ctx.getImageData(0, 0, w, h);
            }

            function setStatus(msg, type = "info") {
                statusEl.textContent = msg;
                statusEl.className = "qr-status " + type;
            }

            function stopCamera() {
                clearInterval(scanTimer);
                scanTimer = null;
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                scanPanel.style.display = "none";
            }

            function onQRFound(text) {
                stopCamera();
                payloadTextarea.value = text;
                setStatus("QR scanned successfully.", "success");
                // Clear status after 3s
                setTimeout(() => { if (statusEl.textContent === "QR scanned successfully.") setStatus(""); }, 3000);
            }

            // Live camera scan
            scanLiveBtn.addEventListener("click", async () => {
                if (!window.isSecureContext) {
                    setStatus("Camera blocked: page is not a secure context. Access Deploy via its HTTPS LAN address in a regular browser to use Scan live.", "error");
                    return;
                }
                if (!navigator.mediaDevices) {
                    setStatus("Camera blocked: navigator.mediaDevices is unavailable. This can happen on http:// even for .onion — try the HTTPS LAN address in a regular browser.", "error");
                    return;
                }
                if (!navigator.mediaDevices.getUserMedia) {
                    setStatus("Camera blocked: getUserMedia is not available in this browser.", "error");
                    return;
                }
                setStatus("Requesting camera… look for a permission prompt at the top of your browser.", "info");
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                    scanPanel.style.display = "block";
                    setStatus("Hold the SeedSigner screen up to your camera…", "info");


                    // Poll for QR at ~15 fps
                    scanTimer = setInterval(() => {
                        if (video.readyState < video.HAVE_ENOUGH_DATA) return;
                        canvas.width  = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(video, 0, 0);
                        const imageData = contrastStretch(ctx, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
                        if (code?.data) onQRFound(code.data);
                    }, 67);
                } catch (e) {
                    if (e.name === "NotAllowedError") {
                        setStatus("Camera permission denied. Click Allow when the browser asks, or use Upload photo.", "error");
                    } else if (e.name === "NotFoundError") {
                        setStatus("No camera found on this device.", "error");
                    } else {
                        setStatus("Camera error: " + e.message + ". Try Upload photo instead.", "error");
                    }
                }
            });

            stopScanBtn.addEventListener("click", stopCamera);

            // Photo upload decode
            uploadPhotoBtn.addEventListener("click", () => photoInput.click());

            function stretchPixels(data) {
                let lo = 255, hi = 0;
                for (let i = 0; i < data.length; i += 4) {
                    const v = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    if (v < lo) lo = v;
                    if (v > hi) hi = v;
                }
                const range = hi - lo || 1;
                const out = new Uint8ClampedArray(data.length);
                for (let i = 0; i < data.length; i += 4) {
                    const v = Math.round(((0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) - lo) / range * 255);
                    out[i] = out[i + 1] = out[i + 2] = v;
                    out[i + 3] = 255;
                }
                return out;
            }

            async function decodePixelData(d1, w1, h1, d2, w2, h2, file) {
                // 1. BarcodeDetector — no canvas read needed
                if ("BarcodeDetector" in window) {
                    try {
                        const bd = new BarcodeDetector({ formats: ["qr_code"] });
                        const bitmap = await createImageBitmap(file);
                        const codes = await bd.detect(bitmap);
                        console.log("[QR] BarcodeDetector:", codes.length);
                        if (codes.length > 0) return codes[0].rawValue;
                    } catch (e) { console.log("[QR] BarcodeDetector:", e.message); }
                }

                // 2. ZXing with RGBLuminanceSource — uses pre-extracted pixel data, no canvas read
                try {
                    const hints = new Map();
                    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                    const reader = new ZXing.MultiFormatReader();
                    reader.setHints(hints);
                    for (const [d, w, h] of [[d1, w1, h1], [d2, w2, h2]]) {
                        try {
                            const u32 = new Uint32Array(d.buffer);
                            const lum = new ZXing.RGBLuminanceSource(u32, w, h, w, h, 0, 0);
                            const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
                            const result = reader.decode(bmp);
                            const text = result?.getText();
                            console.log("[QR] ZXing", w, "x", h, ":", text ? "found" : "null");
                            if (text) return text;
                        } catch (e) { console.log("[QR] ZXing", w, "x", h, ":", e.message); }
                    }
                } catch (e) { console.log("[QR] ZXing setup:", e.message); }

                // 3. jsQR with contrast stretch at both resolutions
                for (const [d, w, h] of [[d1, w1, h1], [d2, w2, h2]]) {
                    const stretched = stretchPixels(d);
                    const code = jsQR(stretched, w, h, { inversionAttempts: "attemptBoth" });
                    console.log("[QR] jsQR", w, "x", h, ":", code ? "found" : "null");
                    if (code?.data) return code.data;
                }

                return null;
            }

            function handleDecodeResult(decoded) {
                console.log("[QR] result:", decoded ? decoded.slice(0, 60) : "null");
                if (decoded) {
                    photoBadge.textContent = "✅";
                    onQRFound(decoded);
                } else {
                    photoBadge.textContent = "❌";
                    setStatus("QR could not be decoded. Make sure the entire QR is fully visible in the frame with no part cut off, then try again.", "error");
                    setTimeout(() => setStatus(""), 8000);
                }
            }

            function canvasFallbackDecode(file) {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const ctx = canvas.getContext("2d");
                    canvas.width  = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    ctx.drawImage(img, 0, 0);
                    let d1, w1 = canvas.width, h1 = canvas.height;
                    try { d1 = ctx.getImageData(0, 0, w1, h1); }
                    catch (e) {
                        URL.revokeObjectURL(url);
                        setStatus("Canvas read blocked: " + e.message + ". Try a different browser.", "error");
                        return;
                    }
                    canvas.width  = img.naturalWidth  * 2;
                    canvas.height = img.naturalHeight * 2;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    let d2, w2 = canvas.width, h2 = canvas.height;
                    try { d2 = ctx.getImageData(0, 0, w2, h2); }
                    catch (e) { d2 = d1; w2 = w1; h2 = h1; }
                    console.log("[QR] canvas pixel[0]:", d1.data[0], d1.data[1], d1.data[2], d1.data[3]);
                    URL.revokeObjectURL(url);
                    decodePixelData(d1.data, w1, h1, d2.data, w2, h2, file).then(handleDecodeResult);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    setStatus("Could not load image.", "error");
                };
                img.src = url;
            }

            photoInput.addEventListener("change", () => {
                const file = photoInput.files[0];
                if (!file) return;
                photoInput.value = "";

                // Show thumbnail — object URL is for display only, no canvas pixel reads from it
                const thumbUrl = URL.createObjectURL(file);
                photoThumb.src = thumbUrl;
                photoBadge.textContent = "";
                photoPreview.style.display = "flex";
                setStatus("Reading QR from photo…", "info");

                // Read file bytes directly — bypasses Tor Browser canvas fingerprinting
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    URL.revokeObjectURL(thumbUrl);
                    const buf    = ev.target.result;
                    const isPng  = file.type === "image/png"  || file.name.toLowerCase().endsWith(".png");
                    const isJpeg = file.type === "image/jpeg" || file.type === "image/jpg" ||
                                   !!file.name.toLowerCase().match(/\.(jpg|jpeg)$/);
                    let pixelData = null;

                    try {
                        if (isPng && typeof UPNG !== "undefined") {
                            const decoded = UPNG.decode(buf);
                            const frames  = UPNG.toRGBA8(decoded);
                            if (frames.length > 0) {
                                pixelData = {
                                    data:   new Uint8ClampedArray(frames[0]),
                                    width:  decoded.width,
                                    height: decoded.height
                                };
                                console.log("[QR] UPNG pixel[0]:", pixelData.data[0], pixelData.data[1],
                                            pixelData.data[2], pixelData.data[3]);
                            }
                        } else if (isJpeg && typeof window["jpeg-js"] !== "undefined") {
                            const decoded = window["jpeg-js"].decode(buf, { useTArray: true, formatAsRGBA: true });
                            pixelData = {
                                data:   new Uint8ClampedArray(decoded.data.buffer),
                                width:  decoded.width,
                                height: decoded.height
                            };
                            console.log("[QR] jpeg-js pixel[0]:", pixelData.data[0], pixelData.data[1],
                                        pixelData.data[2], pixelData.data[3]);
                        }
                    } catch (e) {
                        console.log("[QR] Pure-JS decode failed:", e.message);
                    }

                    if (pixelData) {
                        const decoded = await decodePixelData(
                            pixelData.data, pixelData.width, pixelData.height,
                            pixelData.data, pixelData.width, pixelData.height,
                            file
                        );
                        handleDecodeResult(decoded);
                    } else {
                        // Fallback for non-PNG/JPEG or missing libs — canvas draw
                        canvasFallbackDecode(file);
                    }
                };
                reader.onerror = () => {
                    URL.revokeObjectURL(thumbUrl);
                    setStatus("Could not read image file.", "error");
                };
                reader.readAsArrayBuffer(file);
            });

            // ── Form load / save ─────────────────────────────────────────

            document.addEventListener("DOMContentLoaded", () => {
                const form                 = document.getElementById("edit-email-form");
                const emailAddressInput    = document.getElementById("email-address");
                const emailContentTextarea = document.getElementById("email-content");
                const saveButton           = document.getElementById("save-email-button");

                const urlParams  = new URLSearchParams(window.location.search);
                const emailIndex = urlParams.get("index");

                if (emailIndex !== null) {
                    const emails = JSON.parse(localStorage.getItem("emails") || "[]");
                    const email  = emails[emailIndex];
                    if (email) {
                        emailAddressInput.value    = email.address;
                        emailContentTextarea.value = email.content;
                        payloadTextarea.value      = email.payload || "";
                    }
                }

                form.addEventListener("submit", async (event) => {
                    event.preventDefault();

                    const emailAddress = emailAddressInput.value;
                    const emailContent = emailContentTextarea.value;
                    const emailPayload = payloadTextarea.value.trim();

                    try {
                        const password = localStorage.getItem("userPassword");
                        const response = await fetch("/deadman/emails", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            credentials: "include",
                            body: JSON.stringify({
                                emailAddress,
                                emailContent,
                                emailPayload: emailPayload || null,
                                emailIndex: emailIndex ? parseInt(emailIndex) : null,
                                password: password,
                            }),
                        });

                        if (response.ok) {
                            const emails = JSON.parse(localStorage.getItem("emails") || "[]");
                            const emailData = {
                                address: emailAddress,
                                content: emailContent,
                                ...(emailPayload && { payload: emailPayload }),
                            };

                            if (emailIndex !== null) {
                                emails[emailIndex] = emailData;
                            } else {
                                emails.push(emailData);
                            }

                            localStorage.setItem("emails", JSON.stringify(emails));
                            alert("Email saved successfully!");
                            window.location.href = "/index.html";
                        } else {
                            const errorData = await response.json();
                            alert("Failed to save email: " + (errorData.message || "Unknown error"));
                        }
                    } catch (error) {
                        alert("Failed to save email");
                    }
                });
            });
        </script>
    </body>
</html>
