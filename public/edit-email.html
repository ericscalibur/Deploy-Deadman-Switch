<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Edit Email</title>
        <link rel="stylesheet" href="styles.css" />
        <style>
            .qr-divider {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 12px 0 10px;
                color: ghostwhite;
                font-size: 13px;
                opacity: 0.8;
            }
            .qr-divider::before,
            .qr-divider::after {
                content: "";
                flex: 1;
                height: 1px;
                background: rgba(255,255,255,0.3);
            }
            .qr-buttons {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .qr-btn {
                background: rgba(255,255,255,0.15);
                color: ghostwhite;
                border: 1px solid rgba(255,255,255,0.4);
                border-radius: 6px;
                padding: 8px 14px;
                cursor: pointer;
                font-size: 14px;
                transition: background 0.2s;
            }
            .qr-btn:hover {
                background: rgba(255,255,255,0.25);
            }
            .qr-scan-panel {
                margin-top: 12px;
                display: none;
            }
            .qr-scan-panel video {
                width: 100%;
                max-width: 320px;
                border-radius: 6px;
                border: 2px solid rgba(255,255,255,0.3);
                display: block;
            }
            .qr-status {
                margin-top: 6px;
                font-size: 13px;
                min-height: 18px;
            }
            .qr-status.success { color: #5de88a; }
            .qr-status.error   { color: #ff7b7b; }
            .qr-status.info    { color: ghostwhite; opacity: 0.75; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Edit Email</h1>
            <form id="edit-email-form">
                <label for="email-address">Email Address:</label>
                <input
                    type="email"
                    id="email-address"
                    name="email-address"
                    required
                /><br /><br />

                <label for="email-content">Email Content:</label>
                <br />
                <textarea
                    id="email-content"
                    name="email-content"
                    rows="10"
                    cols="50"
                    maxlength="2000"
                    required
                ></textarea
                ><br /><br />

                <label for="email-payload">Encrypted Payload (optional):</label>
                <br />
                <small>Paste the Legacy encrypted ciphertext here. A QR code will be generated and embedded in the email automatically — the recipient just scans it to decrypt.</small>
                <br /><br />
                <textarea
                    id="email-payload"
                    name="email-payload"
                    rows="4"
                    cols="50"
                    placeholder="Paste encrypted Legacy ciphertext here..."
                ></textarea>

                <!-- QR input alternatives -->
                <div class="qr-divider">or fill from SeedSigner</div>
                <div class="qr-buttons">
                    <button type="button" class="qr-btn" id="scan-live-btn">📷 Scan live</button>
                    <button type="button" class="qr-btn" id="upload-photo-btn">🖼 Upload photo</button>
                </div>
                <input type="file" id="qr-photo-input" accept="image/*" style="display:none" />

                <!-- Live scanner -->
                <div class="qr-scan-panel" id="qr-scan-panel">
                    <video id="qr-video" autoplay playsinline muted></video>
                    <canvas id="qr-canvas" style="display:none"></canvas>
                    <div class="qr-status info" id="qr-status">Hold the SeedSigner screen up to your camera…</div>
                    <button type="button" class="qr-btn" id="stop-scan-btn" style="margin-top:8px">Stop</button>
                </div>

                <br /><br />
                <button type="submit" id="save-email-button">Save</button>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
        <script>
            // ── QR scanning ──────────────────────────────────────────────

            const payloadTextarea = document.getElementById("email-payload");
            const scanLiveBtn     = document.getElementById("scan-live-btn");
            const uploadPhotoBtn  = document.getElementById("upload-photo-btn");
            const photoInput      = document.getElementById("qr-photo-input");
            const scanPanel       = document.getElementById("qr-scan-panel");
            const video           = document.getElementById("qr-video");
            const canvas          = document.getElementById("qr-canvas");
            const statusEl        = document.getElementById("qr-status");
            const stopScanBtn     = document.getElementById("stop-scan-btn");

            let scanTimer = null;
            let stream    = null;

            function setStatus(msg, type = "info") {
                statusEl.textContent = msg;
                statusEl.className = "qr-status " + type;
            }

            function stopCamera() {
                clearInterval(scanTimer);
                scanTimer = null;
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                }
                scanPanel.style.display = "none";
            }

            function onQRFound(text) {
                stopCamera();
                payloadTextarea.value = text;
                setStatus("QR scanned successfully.", "success");
                // Clear status after 3s
                setTimeout(() => { if (statusEl.textContent === "QR scanned successfully.") setStatus(""); }, 3000);
            }

            // Live camera scan
            scanLiveBtn.addEventListener("click", async () => {
                if (!navigator.mediaDevices?.getUserMedia) {
                    alert("Camera access is not supported in this browser.");
                    return;
                }
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                    scanPanel.style.display = "block";
                    setStatus("Hold the SeedSigner screen up to your camera…", "info");

                    // Poll for QR at ~15 fps
                    scanTimer = setInterval(() => {
                        if (video.readyState < video.HAVE_ENOUGH_DATA) return;
                        canvas.width  = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(video, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                        if (code?.data) onQRFound(code.data);
                    }, 67);
                } catch (e) {
                    setStatus("Camera permission denied.", "error");
                }
            });

            stopScanBtn.addEventListener("click", stopCamera);

            // Photo upload decode
            uploadPhotoBtn.addEventListener("click", () => photoInput.click());

            photoInput.addEventListener("change", () => {
                const file = photoInput.files[0];
                if (!file) return;
                photoInput.value = "";

                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    canvas.width  = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
                    if (code?.data) {
                        onQRFound(code.data);
                    } else {
                        setStatus("Could not read QR from photo. Try better lighting or use Scan live.", "error");
                        setTimeout(() => { setStatus(""); }, 4000);
                    }
                };
                img.onerror = () => { setStatus("Could not load image.", "error"); URL.revokeObjectURL(url); };
                img.src = url;
            });

            // ── Form load / save ─────────────────────────────────────────

            document.addEventListener("DOMContentLoaded", () => {
                const form                 = document.getElementById("edit-email-form");
                const emailAddressInput    = document.getElementById("email-address");
                const emailContentTextarea = document.getElementById("email-content");
                const saveButton           = document.getElementById("save-email-button");

                const urlParams  = new URLSearchParams(window.location.search);
                const emailIndex = urlParams.get("index");

                if (emailIndex !== null) {
                    const emails = JSON.parse(localStorage.getItem("emails") || "[]");
                    const email  = emails[emailIndex];
                    if (email) {
                        emailAddressInput.value    = email.address;
                        emailContentTextarea.value = email.content;
                        payloadTextarea.value      = email.payload || "";
                    }
                }

                form.addEventListener("submit", async (event) => {
                    event.preventDefault();

                    const emailAddress = emailAddressInput.value;
                    const emailContent = emailContentTextarea.value;
                    const emailPayload = payloadTextarea.value.trim();

                    try {
                        const password = localStorage.getItem("userPassword");
                        const response = await fetch("/deadman/emails", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            credentials: "include",
                            body: JSON.stringify({
                                emailAddress,
                                emailContent,
                                emailPayload: emailPayload || null,
                                emailIndex: emailIndex ? parseInt(emailIndex) : null,
                                password: password,
                            }),
                        });

                        if (response.ok) {
                            const emails = JSON.parse(localStorage.getItem("emails") || "[]");
                            const emailData = {
                                address: emailAddress,
                                content: emailContent,
                                ...(emailPayload && { payload: emailPayload }),
                            };

                            if (emailIndex !== null) {
                                emails[emailIndex] = emailData;
                            } else {
                                emails.push(emailData);
                            }

                            localStorage.setItem("emails", JSON.stringify(emails));
                            alert("Email saved successfully!");
                            window.location.href = "/index.html";
                        } else {
                            const errorData = await response.json();
                            alert("Failed to save email: " + (errorData.message || "Unknown error"));
                        }
                    } catch (error) {
                        alert("Failed to save email");
                    }
                });
            });
        </script>
    </body>
</html>
